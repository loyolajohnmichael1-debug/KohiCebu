ServerName localhost

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /var/www/html/database>
    Require all denied
</Directory>

<Directory /var/www/html/vendor>
    Require all denied
</Directory>

<Directory /var/www/html>
    <FilesMatch "(\.env|\.log|\.bak|\.backup|\.dump|\.sql|composer\.(json|lock)|Dockerfile|docker-compose\.ya?ml)$">
        Require all denied
    </FilesMatch>
</Directory>
